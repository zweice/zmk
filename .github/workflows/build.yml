name: Build B1 Pro

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-west-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('app/west.yml', '0001-esb-nrf-fix.patch') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: West Init
        run: west init -l app

      - name: West Update
        run: west update

      - name: Patch Zephyr
        # Required by Keychron's README: the ESB/nRF fix re-vectors the shared RADIO IRQ
        # dynamically between the BLE controller and the 2.4G stack, adds the USB SOF
        # counter, and defines bt_bas_set_battery_level_fix().
        # Idempotent: a restored cache may already contain the patched tree.
        working-directory: zephyr
        run: |
          if git apply --reverse --check ../0001-esb-nrf-fix.patch 2>/dev/null; then
            echo "Patch already applied (restored from cache) - skipping."
          else
            git apply --verbose ../0001-esb-nrf-fix.patch
            echo "Patch applied."
          fi

      - name: West Build
        # FIXED: Board is 'keychron', Shield is 'keychron_b1_us' (matches your .keymap file)
        run: west build -b keychron app -- -DSHIELD=keychron_b1_us

      - name: Rename Artifact
        run: cp build/zephyr/zmk.uf2 keychron_b1_pro_firmware.uf2

      - name: Archive Firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: keychron_b1_pro_firmware.uf2
