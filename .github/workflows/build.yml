name: Build B1 Pro

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-west-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('app/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: West Init
        run: west init -l app

      - name: West Update
        run: west update

      - name: West Build
        # FIXED: Board is 'keychron', Shield is 'keychron_b1_us' (matches your .keymap file)
        run: west build -b keychron app -- -DSHIELD=keychron_b1_us

      - name: Rename Artifact
        run: cp build/zephyr/zmk.uf2 keychron_b1_pro_firmware.uf2

      - name: Archive Firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: keychron_b1_pro_firmware.uf2
